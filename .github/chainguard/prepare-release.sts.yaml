# Lets prepare-release.yaml push the prerelease/v* branch and open its PR.
#
# GITHUB_TOKEN would be enough to open the PR, but a PR it authors does not
# trigger other workflows — Control Tests would never run on the release PR.
# Hence a real app token, scoped to this one workflow on main.

issuer: https://token.actions.githubusercontent.com
subject: repo:chainguard-dev/chainguard-inspec:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: chainguard-dev/chainguard-inspec/.github/workflows/prepare-release.yaml@refs/heads/main

permissions:
  contents: write
  pull_requests: write
